name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check binance_fetcher tests
      - name: Format check
        run: uv run ruff format --check binance_fetcher tests
      - name: Type check
        run: uv run mypy binance_fetcher
      - name: Test
        run: uv run pytest
